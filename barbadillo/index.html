   <script>

    $(document).ready(function () {

        var basePath = "https://d1ts5g4ys243sh.cloudfront.net/proyectos_especiales_prod/especiales-multimedia/barbadillo/img/secuencia/";
        var frameCount = 85;
        var sequenceImg = document.getElementById('sequence-img');
        var images = [];
        var currentFrame = 0;

        function frameUrl(i) {
            var name = i <= 40 ? ('Capa-' + i + '-min.jpg') : ('Capa-' + i + '.jpg');
            return basePath + name + '?v1';
        }

        // Precarga las 85 imágenes en paralelo; el scrubber no espera a que terminen,
        // cada frame simplemente aparece en cuanto su descarga llega.
        for (var i = 1; i <= frameCount; i++) {
            var img = new Image();
            img.src = frameUrl(i);
            images.push(img);
        }

        function showFrame(index) {
            if (index === currentFrame) return;
            currentFrame = index;
            sequenceImg.src = images[index].src;
        }

        // Frames que llevan texto superpuesto: necesitan más scroll para dar tiempo a leerlos
        // antes de pasar al siguiente. El número es "cuántos frames normales" dura la pausa.
        var textHoldWeight = {
            50: 10, // "El penal tiene dos biohuertos..."
            69: 10, // "Con las modificaciones realizadas al penal en el 2017..."
            77: 9,  // "Celdas: tienen entre 15 y 16 metros cuadrados..."
            78: 4,  // "Alberto Fujimori"
            79: 4,  // "Pedro Castillo"
            80: 5,  // "Posible celda de Alejandro Toledo"
            81: 3,  // "También cuenta con:"
            82: 4,  // "Enfermería"
            83: 4,  // "Taller"
            84: 5,  // "Oficinas administrativas"
            85: 3
        };

        var weights = [];
        var cumulative = [0];
        for (var f = 1; f <= frameCount; f++) {
            weights.push(textHoldWeight[f] || 1);
            cumulative.push(cumulative[f - 1] + weights[f - 1]);
        }
        var totalWeight = cumulative[frameCount];

        var vh = $(window).height();
        var unitPx = (vh * 3) / frameCount;
        var scrollRange = unitPx * totalWeight;
        $("#main").css('height', (scrollRange + vh) + 'px');

        var ticking = false;

        function frameForScroll(scrollTop) {
            var unit = scrollTop / unitPx;
            var index = 0;
            for (var i = 0; i < frameCount; i++) {
                if (unit >= cumulative[i]) index = i;
                else break;
            }
            return Math.min(frameCount - 1, Math.max(0, index));
        }

        function update() {
            var scrollTop = $(window).scrollTop();
            showFrame(frameForScroll(scrollTop));
            ticking = false;
        }

        $(window).on('scroll', function () {
            if (!ticking) {
                requestAnimationFrame(update);
                ticking = true;
            }
        });
        update();
    });

   </script>
